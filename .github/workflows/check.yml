name: 당근 키워드 알림

on:
  schedule:
    # 정확한 5분 실행은 cron-job.org → /api/tick 이 맡는다. 이건 그게 멈췄을 때를 위한 예비용.
    # (GitHub 예약 실행은 크게 밀리거나 빠진다. 정각은 특히 붐벼서 피함)
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "텔레그램 테스트 메시지만 보내기"
        type: boolean
        default: false
      preview:
        description: "이 키워드로 미리보기만 (알림·기록 없음)"
        type: string
        default: ""

concurrency:
  group: daangn-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    steps:
      # 예비 예약 실행은 GitHub 사정으로 크게 밀려 cron-job.org 실행과 겹치곤 한다(2026-10-22 충돌).
      # 다른 실행이 돌고 있거나 4분 안에 끝났으면 건너뛴다. (당근 요청도 두 배로 나가지 않게)
      - name: 겹치는 예비 실행 건너뛰기
        id: dup
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          others=$(gh run list -R "$GITHUB_REPOSITORY" -w check.yml -L 10 --json databaseId,status,updatedAt \
            -q "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status != \"completed\" or (.updatedAt | fromdateiso8601) > (now - 240))] | length")
          if [ "$others" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "다른 실행과 겹쳐서 건너뜀"; fi

      # 순서를 기다렸다 시작하는 실행도 최신 기록을 받도록, 실행 시점의 main을 받는다
      # (기본값은 '실행 요청 시점'의 커밋이라 앞 실행이 저장한 기록이 빠진다)
      - uses: actions/checkout@v4
        if: steps.dup.outputs.skip != 'true'
        with:
          ref: main

      - uses: actions/setup-node@v4
        if: steps.dup.outputs.skip != 'true'
        with:
          node-version: 22

      - name: 새 매물 확인 및 알림
        if: steps.dup.outputs.skip != 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          if [ -n "$PREVIEW" ]; then node src/check.js --dry-run --keyword "$PREVIEW"
          else node src/check.js ${{ inputs.test && '--test' || '' }}; fi

      # 기록을 저장한다. 관리 페이지가 같은 시간에 키워드를 바꿨을 수 있으니 rebase 후 push.
      # data/ 는 기계가 쓰는 기록이라, 그래도 충돌하면 이번 실행 내용(더 최신)을 택한다.
      # (rebase 중에는 'theirs' 가 지금 다시 얹는 이번 실행의 커밋을 뜻한다)
      - name: 기록 저장
        if: always() && steps.dup.outputs.skip != 'true'
        run: |
          git config user.name "daangn-alert-bot"
          git config user.email "daangn-alert-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "chore: 본 매물 기록 갱신"
          for i in 1 2 3; do
            git pull --rebase -X theirs -q && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
