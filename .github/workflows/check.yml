name: 당근 키워드 알림

on:
  schedule:
    # 정확한 5분 실행은 cron-job.org → /api/tick 이 맡는다. 이건 그게 멈췄을 때를 위한 예비용.
    # (GitHub 예약 실행은 크게 밀리거나 빠진다. 정각은 특히 붐벼서 피함)
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "텔레그램 테스트 메시지만 보내기"
        type: boolean
        default: false
      preview:
        description: "이 키워드로 미리보기만 (알림·기록 없음)"
        type: string
        default: ""

concurrency:
  group: daangn-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 새 매물 확인 및 알림
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          if [ -n "$PREVIEW" ]; then node src/check.js --dry-run --keyword "$PREVIEW"
          else node src/check.js ${{ inputs.test && '--test' || '' }}; fi

      # 본 매물 기록을 저장한다. 관리 페이지가 같은 시간에 키워드를 바꿨을 수 있으니 rebase 후 push.
      - name: 기록 저장
        if: always()
        run: |
          git config user.name "daangn-alert-bot"
          git config user.email "daangn-alert-bot@users.noreply.github.com"
          git add data/seen.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: 본 매물 기록 갱신"
          for i in 1 2 3; do
            git pull --rebase -q && git push -q && exit 0
            sleep 3
          done
          exit 1
